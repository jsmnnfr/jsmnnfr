<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0b0b0b; }
    .title { fill: #8b0000; font-size: 18px; font-family: monospace; }
    .text { fill: #e6e6e6; font-size: 12px; font-family: monospace; }
    .danger { fill: #8b0000; }
    .pulse {
      animation: pulse 1.2s infinite;
      transform-origin: center;
    }
    .flicker {
      animation: flicker 3s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    @keyframes flicker {
      0% { opacity: 1; }
      10% { opacity: 0.6; }
      20% { opacity: 1; }
      30% { opacity: 0.5; }
      40% { opacity: 1; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="420" height="180" class="bg"/>

  <!-- Title -->
  <text x="20" y="30" class="title flicker">
    ESCAPE THE UPSIDE DOWN
  </text>

  <!-- Status -->
  <text x="20" y="60" class="text">
    STATUS: ALIVE
  </text>
  <text x="20" y="80" class="text">
    SANITY: 78%
  </text>

  <!-- Danger Meter -->
  <text x="20" y="110" class="text">
    THREAT LEVEL
  </text>

  <rect x="20" y="120" width="300" height="12" fill="#222"/>
  <rect x="20" y="120" width="210" height="12" class="danger pulse"/>

  <!-- Heartbeat -->
  <text x="20" y="155" class="text pulse">
    ♥ HEART RATE: UNSTABLE
  </text>
</svg>
