<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ===== BASE ===== */
    .bg {
      fill: #0b0b0b;
      animation: bgFlicker 4s infinite;
    }

    .wire {
      stroke: #333;
      stroke-width: 2;
    }

    .letter {
      fill: #555;
      font-family: monospace;
      font-size: 16px;
      text-anchor: middle;
      pointer-events: all;
    }

    .light {
      fill: #222;
    }

    /* ===== RUN BLINK ===== */
    .run-r { animation: blinkR 3.5s infinite; }
    .run-u { animation: blinkU 3.5s infinite; }
    .run-n { animation: blinkN 3.5s infinite; }

    @keyframes blinkR {
      0%,15% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      16%,100% { fill:#222; filter:none; }
    }

    @keyframes blinkU {
      0%,15% { fill:#222; }
      16%,30% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      31%,100% { fill:#222; filter:none; }
    }

    @keyframes blinkN {
      0%,30% { fill:#222; }
      31%,45% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      46%,100% { fill:#222; filter:none; }
    }

    /* ===== BACKGROUND FLICKER ===== */
    @keyframes bgFlicker {
      0%,100% { opacity: 1; }
      15% { opacity: .85; }
      30% { opacity: 1; }
      45% { opacity: .7; }
      60% { opacity: 1; }
    }

    .title {
      fill: #8b0000;
      font-family: monospace;
      font-size: 20px;
      animation: titleFlicker 3s infinite;
    }

    @keyframes titleFlicker {
      0%,100% { opacity: 1; }
      40% { opacity: .5; }
      60% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="760" height="360" class="bg"/>

  <!-- Title -->
  <text x="20" y="32" class="title">
    EPISODE IX — RUN
  </text>

  <!-- Wires -->
  <line x1="40" y1="90" x2="720" y2="90" class="wire"/>
  <line x1="40" y1="170" x2="720" y2="170" class="wire"/>
  <line x1="40" y1="250" x2="720" y2="250" class="wire"/>

  <!-- ROW 1: A–I -->
  <g transform="translate(40,90)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>Static.</title>A</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>Quiet.</title>B</text>
    <circle cx="160" cy="0" r="7" class="light"/><text x="160" y="28" class="letter"><title>Don’t move.</title>C</text>
    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>It’s close.</title>D</text>
    <circle cx="320" cy="0" r="7" class="light"/><text x="320" y="28" class="letter"><title>Listen.</title>E</text>
    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>Cold.</title>F</text>
    <circle cx="480" cy="0" r="7" class="light"/><text x="480" y="28" class="letter"><title>Too late.</title>G</text>
    <circle cx="560" cy="0" r="7" class="light"/><text x="560" y="28" class="letter"><title>Hide.</title>H</text>
    <circle cx="640" cy="0" r="7" class="light"/><text x="640" y="28" class="letter"><title>Invisible.</title>I</text>
  </g>

  <!-- ROW 2: J–R -->
  <g transform="translate(40,170)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>No signal.</title>J</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>Lost.</title>K</text>
    <circle cx="160" cy="0" r="7" class="light"/><text x="160" y="28" class="letter"><title>Stay alive.</title>L</text>
    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>Behind you.</title>M</text>

    <!-- N (RUN) -->
    <circle cx="320" cy="0" r="7" class="light run-n"/>
    <text x="320" y="28" class="letter"><title>NOW.</title>N</text>

    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>Cold breath.</title>O</text>
    <circle cx="480" cy="0" r="7" class="light"/><text x="480" y="28" class="letter"><title>Please.</title>P</text>
    <circle cx="560" cy="0" r="7" class="light"/><text x="560" y="28" class="letter"><title>Don’t look.</title>Q</text>

    <!-- R (RUN) -->
    <circle cx="640" cy="0" r="7" class="light run-r"/>
    <text x="640" y="28" class="letter"><title>RUN.</title>R</text>
  </g>

  <!-- ROW 3: S–Z -->
  <g transform="translate(40,250)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>Too loud.</title>S</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>They hear you.</title>T</text>

    <!-- U (RUN) -->
    <circle cx="160" cy="0" r="7" class="light run-u"/>
    <text x="160" y="28" class="letter"><title>RUN.</title>U</text>

    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>Silence.</title>V</text>
    <circle cx="320" cy="0" r="7" class="light"/><text x="320" y="28" class="letter"><title>Wrong way.</title>W</text>
    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>It’s watching.</title>X</text>
    <circle cx="480" cy="0" r="7" class="light"/><text x="480" y="28" class="letter"><title>Almost.</title>Y</text>
    <circle cx="560" cy="0" r="7" class="light"/><text x="560" y="28" class="letter"><title>Don’t stop.</title>Z</text>
  </g>

  <!-- Footer -->
  <text x="20" y="335" fill="#888" font-family="monospace" font-size="12">
    MESSAGE FROM THE OTHER SIDE: RUN
  </text>
</svg>
