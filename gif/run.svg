<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ===== BASE ===== */
    .bg { fill: #0b0b0b; animation: bgFlicker 5s infinite; }
    .letter {
      fill: #555;
      font-family: monospace;
      font-size: 16px;
      text-anchor: middle;
      pointer-events: all;
    }
    .wire { stroke: #333; stroke-width: 2; }
    .light { fill: #222; }

    /* ===== WORD CYCLE ===== */
    .run-r { animation: runR 12s infinite; }
    .run-u { animation: runU 12s infinite; }
    .run-n { animation: runN 12s infinite; }

    .hide-h { animation: hideH 12s infinite; }
    .hide-i { animation: hideI 12s infinite; }
    .hide-d { animation: hideD 12s infinite; }
    .hide-e { animation: hideE 12s infinite; }

    .help-h { animation: helpH 12s infinite; }
    .help-e { animation: helpE 12s infinite; }
    .help-l { animation: helpL 12s infinite; }
    .help-p { animation: helpP 12s infinite; }

    /* ===== EMERGENCY MODE ===== */
    .emergency {
      animation: emergencyFlash 12s infinite;
    }

    /* ===== KEYFRAMES ===== */
    @keyframes bgFlicker {
      0%,100% { opacity: 1; }
      10% { opacity: .85; }
      20% { opacity: 1; }
      30% { opacity: .7; }
      40% { opacity: 1; }
    }

    @keyframes emergencyFlash {
      0%,65% { fill: #222; }
      66%,75% { fill: #8b0000; filter: drop-shadow(0 0 8px #8b0000); }
      76%,100% { fill: #222; }
    }

    /* RUN (0–33%) */
    @keyframes runR { 0%,5%{fill:#ffcc33;} 6%,100%{fill:#222;} }
    @keyframes runU { 0%,10%{fill:#222;} 11%,16%{fill:#ffcc33;} 17%,100%{fill:#222;} }
    @keyframes runN { 0%,16%{fill:#222;} 17%,22%{fill:#ffcc33;} 23%,100%{fill:#222;} }

    /* ===== HIDE (33% – 66%) ===== */
    @keyframes hideH {
      0%,33% { fill:#222; }
      34%,38% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      39%,100% { fill:#222; }
    }
    
    @keyframes hideI {
      0%,38% { fill:#222; }
      39%,43% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      44%,100% { fill:#222; }
    }
    
    @keyframes hideD {
      0%,43% { fill:#222; }
      44%,48% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      49%,100% { fill:#222; }
    }
    
    @keyframes hideE {
      0%,48% { fill:#222; }
      49%,53% { fill:#ffcc33; filter: drop-shadow(0 0 8px #ffcc33); }
      54%,100% { fill:#222; }
    }


    /* HELP (66–100%) */
    @keyframes helpH { 0%,66%{fill:#222;} 67%,72%{fill:#ff4444;} 73%,100%{fill:#222;} }
    @keyframes helpE { 0%,72%{fill:#222;} 73%,78%{fill:#ff4444;} 79%,100%{fill:#222;} }
    @keyframes helpL { 0%,78%{fill:#222;} 79%,84%{fill:#ff4444;} 85%,100%{fill:#222;} }
    @keyframes helpP { 0%,84%{fill:#222;} 85%,90%{fill:#ff4444;} 91%,100%{fill:#222;} }
  </style>

  <!-- Background -->
  <rect width="760" height="380" class="bg"/>

  <!-- Title -->
  <text x="20" y="32" fill="#8b0000" font-family="monospace" font-size="20">
    EPISODE X — CHRISTMAS LIGHTS
  </text>

  <!-- Wires -->
  <line x1="40" y1="90" x2="720" y2="90" class="wire"/>
  <line x1="40" y1="170" x2="720" y2="170" class="wire"/>
  <line x1="40" y1="250" x2="720" y2="250" class="wire"/>

  <!-- ROW 1: A–I -->
  <g transform="translate(40,90)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>Static.</title>A</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>Quiet.</title>B</text>
    <circle cx="160" cy="0" r="7" class="light"/><text x="160" y="28" class="letter"><title>Don’t move.</title>C</text>
    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>It’s close.</title>D</text>
    <circle cx="320" cy="0" r="7" class="light hide-e"/><text x="320" y="28" class="letter"><title>Hide.</title>E</text>
    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>Listen.</title>F</text>
    <circle cx="480" cy="0" r="7" class="light"/><text x="480" y="28" class="letter"><title>Too late.</title>G</text>
    <circle cx="560" cy="0" r="7" class="light hide-h help-h"/><text x="560" y="28" class="letter"><title>HELP.</title>H</text>
    <circle cx="640" cy="0" r="7" class="light hide-i"/><text x="640" y="28" class="letter"><title>Invisible.</title>I</text>
  </g>

  <!-- ROW 2: J–R -->
  <g transform="translate(40,170)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>No signal.</title>J</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>Lost.</title>K</text>
    <circle cx="160" cy="0" r="7" class="light help-l"/><text x="160" y="28" class="letter"><title>Stay alive.</title>L</text>
    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>Behind you.</title>M</text>
    <circle cx="320" cy="0" r="7" class="light run-n emergency"/><text x="320" y="28" class="letter"><title>NOW.</title>N</text>
    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>Cold.</title>O</text>
    <circle cx="480" cy="0" r="7" class="light help-p"/><text x="480" y="28" class="letter"><title>PLEASE.</title>P</text>
    <circle cx="560" cy="0" r="7" class="light"/><text x="560" y="28" class="letter"><title>RUN.</title>Q</text>
    <circle cx="640" cy="0" r="7" class="light run-r emergency"/><text x="640" y="28" class="letter"><title>RUN.</title>R</text>
  </g>

  <!-- ROW 3: S–Z -->
  <g transform="translate(40,250)">
    <circle cx="0" cy="0" r="7" class="light"/><text x="0" y="28" class="letter"><title>Too loud.</title>S</text>
    <circle cx="80" cy="0" r="7" class="light"/><text x="80" y="28" class="letter"><title>They hear you.</title>T</text>
    <circle cx="160" cy="0" r="7" class="light run-u emergency"/><text x="160" y="28" class="letter"><title>RUN.</title>U</text>
    <circle cx="240" cy="0" r="7" class="light"/><text x="240" y="28" class="letter"><title>Silence.</title>V</text>
    <circle cx="320" cy="0" r="7" class="light"/><text x="320" y="28" class="letter"><title>Wrong way.</title>W</text>
    <circle cx="400" cy="0" r="7" class="light"/><text x="400" y="28" class="letter"><title>It’s watching.</title>X</text>
    <circle cx="480" cy="0" r="7" class="light"/><text x="480" y="28" class="letter"><title>Almost.</title>Y</text>
    <circle cx="560" cy="0" r="7" class="light"/><text x="560" y="28" class="letter"><title>Don’t stop.</title>Z</text>
  </g>

  <!-- Footer -->
  <text x="20" y="350" fill="#888" font-family="monospace" font-size="12">
    MESSAGE CYCLE: RUN → HIDE → HELP
  </text>
</svg>
